<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=IBM+Plex+Mono:wght@500&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first. The 3D board fills the screen; a bottom sheet holds the action button and tabs. On wide screens the sheet docks to the right. */
:root{
  --bg:#efe8d8; --surface:#fbf7ee; --ink:#1d2433; --muted:#5f6472; --line:#d9cfb8;
  --accent:#1f5d8e; --accent-ink:#ffffff; --brass:#a87414; --danger:#b23a30; --good:#2e7a47;
  --hud:rgba(251,247,238,.92);
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --dockw:380px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#151d31; --ink:#eef0f6; --muted:#a3abc0; --line:#2b3550;
  --accent:#6fb3e8; --accent-ink:#0b1311; --brass:#e0b45a; --danger:#ee7468; --good:#61c283; --hud:rgba(21,29,49,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#151d31; --ink:#eef0f6; --muted:#a3abc0; --line:#2b3550;
  --accent:#6fb3e8; --accent-ink:#0b1311; --brass:#e0b45a; --danger:#ee7468; --good:#61c283; --hud:rgba(21,29,49,.9); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
.stagewrap{position:fixed;inset:0;z-index:0}
.stage{position:absolute;inset:0;background:var(--bg);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;pointer-events:none}
.topbar>*{pointer-events:auto}
.chipbox{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:6px 10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.brand span{color:var(--accent)}
.hdr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.12em}
.cash{font-family:var(--mono);font-weight:500;font-size:15px}
.hud{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.pillbox{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:600;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100% - 60px)}
.cardshow{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:min(calc(100% - 60px),320px);font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cardshow .label{display:block;margin-bottom:2px}
.cardshow.fortune .label{color:var(--brass)}
.cardshow.whip .label{color:var(--accent)}
.views{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;gap:6px}
.views .btn{background:var(--hud);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:44px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.22);
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;max-height:64vh;max-height:64dvh}
.handle{align-self:stretch;height:22px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.handle::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
.dockbody{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0;overscroll-behavior:contain;padding-bottom:8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line);padding-top:6px;flex:0 0 auto}
.tabs button{border:0;background:none;padding:6px 2px;font-size:13px;font-weight:600;color:var(--muted);min-height:44px;border-radius:10px;cursor:pointer;position:relative}
.tabs button[aria-selected=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tabs .dotb{position:absolute;top:6px;right:calc(50% - 30px);width:8px;height:8px;border-radius:50%;background:var(--danger)}
.panels{display:flex;flex-direction:column;gap:10px}
.panels[data-tab="streets"]>[data-pane]:not([data-pane="turn"]):not([data-pane="streets"]),
.panels[data-tab="players"]>[data-pane]:not([data-pane="turn"]):not([data-pane="players"]),
.panels[data-tab="trade"]>[data-pane]:not([data-pane="turn"]):not([data-pane="trade"]),
.panels[data-tab="log"]>[data-pane]:not([data-pane="turn"]):not([data-pane="log"]){display:none}
.dock.collapsed .panels>[data-pane]:not([data-pane="turn"]){display:none}
.dock.collapsed .pitch .more{display:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:54px;font-size:17px;flex:1 1 140px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.small{min-height:36px;padding:6px 11px;font-size:13px}
.btn.link{border:0;background:none;padding:4px 2px;min-height:0;color:var(--accent);text-decoration:underline;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.g{display:inline-block;font-weight:700}
.pitch{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.pitch h1{font-size:clamp(40px,12vw,80px);text-transform:uppercase;line-height:.9;letter-spacing:.02em}
.pitch h1 span{color:var(--accent)}
.pitch p{margin:0;color:var(--muted)}
.tables{display:flex;flex-direction:column;gap:8px}
.tbl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.wait{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 50%,var(--line))}
.pill.play{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding:4px 0 4px 10px;margin:0}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:20px;text-transform:uppercase}
.panel.turn{background:transparent;border:0;padding:4px 0}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px}
.prow.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.prow.out{opacity:.45;text-decoration:line-through}
.prow .tk{font-size:18px;text-align:center}
.prow .nmw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow .sub{font-size:12px;color:var(--muted);font-weight:400}
.neg{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;min-height:34px}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip.m{opacity:.55}
table.rent{width:100%;border-collapse:collapse;font-size:13px}
table.rent td{padding:4px 0;border-bottom:1px solid var(--line)}
table.rent td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.rent tr.on td{font-weight:700;color:var(--accent)}
.swatch{height:10px;border-radius:3px}
.log{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-size:13px}
.log div{padding-bottom:5px;border-bottom:1px solid var(--line)}
.warn{color:var(--danger);font-weight:600;font-size:14px}
.tradegrid{display:grid;grid-template-columns:1fr;gap:10px}
.tradegrid fieldset{border:1px solid var(--line);border-radius:10px;padding:8px;margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.tradegrid legend{font-size:12px;font-weight:600;padding:0 4px}
.tradegrid label{font-size:14px;display:flex;gap:8px;align-items:center;min-height:32px}
input[type=number],input[type=text],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:44px;width:100%;font-size:16px}
.lobby{display:flex;flex-direction:column;gap:12px}
.toks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.toks button{font-size:12px;font-weight:600;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.toks button .g{font-size:20px;line-height:1}
.toks button[aria-pressed=true]{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.toks button:disabled{opacity:.25;cursor:not-allowed}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,460px);z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.last{font-size:13px;color:var(--muted);margin:0}
.pop{position:fixed;z-index:20;font-family:var(--mono);font-weight:700;font-size:16px;pointer-events:none;animation:pop 1.4s ease-out forwards;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pop.up{color:#2fa060}.pop.down{color:#d2463a}
@keyframes pop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.buyinfo{display:flex;gap:10px;align-items:center}
.buyinfo .sw{width:10px;align-self:stretch;border-radius:4px}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
@media (min-width:960px){
  .dock{left:auto;top:0;width:var(--dockw);max-height:none;border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 64px) 18px 18px;box-shadow:-10px 0 34px rgba(0,0,0,.14)}
  .handle,.tabs{display:none}
  .panels>[data-pane]{display:flex!important}
  .dock.collapsed .pitch .more{display:flex}
  .views,.topbar .hdr{right:calc(var(--dockw) + 16px)}
  .topbar{right:var(--dockw)}
  .hud{right:calc(var(--dockw) + 16px)}
  .views{right:calc(var(--dockw) + 16px)}
  .panel.turn{background:var(--bg);border:2px solid var(--accent);padding:12px}
  .tradegrid{grid-template-columns:1fr 1fr}
}
</style>

<div id="stageSlot" class="stagewrap"></div>
<header class="topbar"><div class="brand chipbox">M<span>.</span>Go</div><div class="hdr" id="hdr"></div></header>
<section class="dock" id="dock" aria-label="Game panel"><button class="handle" type="button" data-act="dock" aria-label="Show or hide the panel"></button><div class="dockbody" id="dockbody"><p class="muted">Setting up the table…</p></div><nav class="tabs" id="tabs" hidden></nav></section>
<div id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-adapter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script>
// ================= Board data =================
const GC=['#8a5a2b','#1fb5d6','#e0388f','#f28c1a','#e2312b','#f5c400','#18a558','#2448c8'];
const SP=[
 {n:'Mount Olympus',t:'go',ic:'⚡'},
 {n:'Ogygia Cove',t:'prop',g:0,p:60},{n:'Oracle',t:'whip',ic:'👁'},{n:'Aiaia Isle',t:'prop',g:0,p:60},
 {n:"Agamemnon's Tribute",t:'tax',amt:200,ic:'🏺'},{n:'Harbour of Aulis',t:'rail',p:200,ic:'⛵'},
 {n:'Ithaca Harbour',t:'prop',g:1,p:100},{n:'The Fates',t:'fortune',ic:'🧵'},{n:'Mount Neriton',t:'prop',g:1,p:100},{n:"Eumaeus's Farm",t:'prop',g:1,p:120},
 {n:"Cyclops' Cave",t:'jail',ic:'👁'},
 {n:'Pylos Beach',t:'prop',g:2,p:140},{n:'Forge of Hephaestus',t:'util',p:150,ic:'🔥'},{n:"Nestor's Palace",t:'prop',g:2,p:140},{n:'Messene',t:'prop',g:2,p:160},
 {n:'Harbour of Tenedos',t:'rail',p:200,ic:'⛵'},
 {n:'Scheria Shore',t:'prop',g:3,p:180},{n:'Oracle',t:'whip',ic:'👁'},{n:'Gardens of Alcinous',t:'prop',g:3,p:180},{n:'Phaeacian Hall',t:'prop',g:3,p:200},
 {n:'Lotus Isle',t:'free',ic:'🌸'},
 {n:'Argos',t:'prop',g:4,p:220},{n:'The Fates',t:'fortune',ic:'🧵'},{n:'Tiryns',t:'prop',g:4,p:220},{n:'Nemea',t:'prop',g:4,p:240},
 {n:'Harbour of Crete',t:'rail',p:200,ic:'⛵'},
 {n:'Sparta',t:'prop',g:5,p:260},{n:'Amyklai',t:'prop',g:5,p:260},{n:'Sacred Spring',t:'util',p:150,ic:'💧'},{n:"Menelaus's Palace",t:'prop',g:5,p:280},
 {n:'Captured!',t:'gojail',ic:'⛓'},
 {n:'Plain of Scamander',t:'prop',g:6,p:300},{n:'Walls of Troy',t:'prop',g:6,p:300},{n:'Oracle',t:'whip',ic:'👁'},{n:"Priam's Citadel",t:'prop',g:6,p:320},
 {n:'Harbour of Rhodes',t:'rail',p:200,ic:'⛵'},{n:'The Fates',t:'fortune',ic:'🧵'},
 {n:'The Lion Gate',t:'prop',g:7,p:350},{n:"Poseidon's Offering",t:'tax',amt:100,ic:'🔱'},{n:'Citadel of Mycenae',t:'prop',g:7,p:400}
];
const GROUP={};SP.forEach((s,i)=>{if(s.t==='prop')(GROUP[s.g]=GROUP[s.g]||[]).push(i)});
const RAILS=SP.map((s,i)=>s.t==='rail'?i:-1).filter(i=>i>=0);
const UTILS=SP.map((s,i)=>s.t==='util'?i:-1).filter(i=>i>=0);
const BUYABLE=t=>t==='prop'||t==='rail'||t==='util';
const MULT=[1,5,14,38,50,62];
const baseRent=sp=>Math.max(2,Math.round(sp.p*0.07));
const rentTable=sp=>MULT.map(m=>baseRent(sp)*m);
const houseCost=i=>i<10?50:i<20?100:i<30?150:200;
const unmortCost=i=>Math.ceil(SP[i].p*0.55);
const TOKS={
  pawn:{n:'Helmet',g:'⛑',c:'#d8433b'}, cone:{n:'Amphora',g:'🏺',c:'#e07a2a'}, cube:{n:'Horse',g:'🐴',c:'#b07a3c'}, gem:{n:'Trident',g:'🔱',c:'#2f86d8'},
  ring:{n:'Laurel',g:'🌿',c:'#35a85a'}, star:{n:'Shield',g:'🛡',c:'#9b59d0'}, capsule:{n:'Owl',g:'🦉',c:'#1fb2aa'}, pyramid:{n:'Column',g:'🏛',c:'#e0559f'}
};
const TOKENS=Object.keys(TOKS);

const FORTUNE=[
 {t:'Zeus summons you. Advance to Mount Olympus and collect 🪙200.',a:'move',to:0},
 {t:'Agamemnon calls the kings. Sail to the Citadel of Mycenae.',a:'move',to:39},
 {t:'Menelaus needs you in Sparta. Collect 🪙200 if you pass Olympus.',a:'move',to:26},
 {t:'Poseidon\'s winds drive you to the nearest harbour. Pay the owner double.',a:'station'},
 {t:'The Sirens sing. You drift back 3 spaces.',a:'back',n:3},
 {t:'Polyphemus grabs you. Go straight to the Cyclops\' Cave.',a:'jail'},
 {t:'Athena guides you out. Escape the Cyclops\' Cave free. Keep this until you need it.',a:'free'},
 {t:'Your share of the plunder from Troy. Collect 🪙150.',a:'cash',n:150},
 {t:'Hermes brings a gift. Collect 🪙50.',a:'cash',n:50},
 {t:'Pay the ferryman 🪙15.',a:'cash',n:-15},
 {t:'Poseidon shakes the earth. Pay 🪙25 per villa and 🪙100 per temple.',a:'repairs',h:25,H:100},
 {t:'You host a feast for the Achaean kings. Pay each player 🪙50.',a:'each',n:-50}
];
const WHIP=[
 {t:'The Oracle sends you to Mount Olympus. Collect 🪙200.',a:'move',to:0},
 {t:'The gods return your libation. Collect 🪙20.',a:'cash',n:20},
 {t:'The suitors eat through your stores. Pay 🪙40.',a:'cash',n:-40},
 {t:'You find a golden cup in the sand. Collect 🪙10.',a:'cash',n:10},
 {t:'Your chariot wheel breaks. Pay 🪙100.',a:'cash',n:-100},
 {t:'Second place in the chariot race. Collect 🪙25.',a:'cash',n:25},
 {t:'A hero leaves you his armour. Collect 🪙100.',a:'cash',n:100},
 {t:'It\'s your feast day. Collect 🪙10 from every player.',a:'each',n:10},
 {t:'You sell a jar of olive oil. Collect 🪙45.',a:'cash',n:45},
 {t:'Athena guides you out. Escape the Cyclops\' Cave free. Keep this until you need it.',a:'free'},
 {t:'A storm cracks your ship\'s mast. Pay 🪙50.',a:'cash',n:-50},
 {t:'Repair the city walls. Pay 🪙40 per villa and 🪙115 per temple.',a:'repairs',h:40,H:115},
 {t:'You angered Poseidon. Go straight to the Cyclops\' Cave.',a:'jail'}
];

// ================= Rules engine =================
let me=null;
const r6=()=>1+Math.floor(Math.random()*6);
const P=(s,id)=>s.players.find(p=>p.id===id);
const cur=s=>s.players[s.turn];
const pt=id=>'{{p:'+id+'}}', st=i=>'{{s:'+i+'}}';
function L(s,t){s.log.push(t);if(s.log.length>80)s.log=s.log.slice(-80)}
function payTo(s,p,amt,toId){p.cash-=amt;if(toId){const q=P(s,toId);if(q)q.cash+=amt}if(p.cash<0)p.creditor=toId||null}
const ownsGroup=(s,g,id)=>GROUP[g].every(j=>s.props[j]&&s.props[j].o===id);
function rentFor(s,i){
  const sp=SP[i],o=s.props[i];if(!o||o.m)return 0;
  if(sp.t==='prop'){const t=rentTable(sp);if(o.h>0)return t[o.h];return t[0]*(ownsGroup(s,sp.g,o.o)?2:1)}
  if(sp.t==='rail'){const c=RAILS.filter(j=>s.props[j]&&s.props[j].o===o.o).length;return [25,50,100,200][c-1]}
  if(sp.t==='util'){const c=UTILS.filter(j=>s.props[j]&&s.props[j].o===o.o).length;return (s.dice[0]+s.dice[1])*(c===2?10:4)}

function buildLandmark(scene,dark){
  const T=S3.T,g=new T.Group();
  const stone=new T.MeshStandardMaterial({color:0xd9ccb2,roughness:0.85});
  const marble=new T.MeshStandardMaterial({color:0xf6f1e7,roughness:0.5});
  const gold=new T.MeshStandardMaterial({color:0xd4a833,metalness:0.9,roughness:0.25,envMap:S3.env||null});
  const add=(m,x,y,z)=>{m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m};
  // stepped hill (acropolis)
  [[2.1,0.18],[1.75,0.18],[1.4,0.18]].forEach((s,k)=>add(new T.Mesh(new T.BoxGeometry(s[0],s[1],s[0]),k?marble:stone),0,0.09+k*0.18,0));
  // temple: columns + pediment
  const baseY=0.54,colH=0.9,W=1.2,D=0.86;
  for(let i=0;i<6;i++)[-1,1].forEach(sd=>{const x=-W/2+i*(W/5);add(new T.Mesh(new T.CylinderGeometry(0.05,0.06,colH,14),marble),x,baseY+colH/2,sd*D/2)});
  for(let i=1;i<4;i++)[-1,1].forEach(sd=>{const z=-D/2+i*(D/4);add(new T.Mesh(new T.CylinderGeometry(0.05,0.06,colH,14),marble),sd*W/2,baseY+colH/2,z)});
  add(new T.Mesh(new T.BoxGeometry(W*0.7,colH*0.9,D*0.55),new T.MeshStandardMaterial({color:0xe6dccb,roughness:0.7})),0,baseY+colH*0.45,0);
  add(new T.Mesh(new T.BoxGeometry(W+0.2,0.1,D+0.2),marble),0,baseY+colH+0.05,0);
  const pedG=new T.CylinderGeometry(0.62,0.62,W+0.24,3,1);pedG.rotateZ(Math.PI/2);
  const ped=add(new T.Mesh(pedG,new T.MeshStandardMaterial({color:0xc4513a,roughness:0.6})),0,baseY+colH+0.1+0.3,0);ped.scale.set(1,0.48,0.9);
  // golden statue of Zeus-like figure on top
  add(new T.Mesh(new T.CylinderGeometry(0.06,0.09,0.28,10),gold),0,baseY+colH+0.82,0);
  add(new T.Mesh(new T.SphereGeometry(0.07,14,10),gold),0,baseY+colH+1.02,0);
  const bolt=add(new T.Mesh(new T.ConeGeometry(0.035,0.4,6),gold),0.12,baseY+colH+1.05,0);bolt.rotation.z=-0.5;
  // braziers with fire
  const fireMat=new T.MeshBasicMaterial({color:0xffa12e});S3.fires=[];
  [[-0.95,0.95],[0.95,0.95],[-0.95,-0.95],[0.95,-0.95]].forEach(p=>{add(new T.Mesh(new T.CylinderGeometry(0.03,0.04,0.42,8),gold),p[0],0.39,p[1]);add(new T.Mesh(new T.CylinderGeometry(0.1,0.05,0.08,12),gold),p[0],0.62,p[1]);
    const f=new T.Mesh(new T.ConeGeometry(0.07,0.2,8),fireMat);f.position.set(p[0],0.74,p[1]);g.add(f);S3.fires.push(f)});
  const flameLight=new T.PointLight(0xffa040,dark?1.2:0.3,6,2);flameLight.position.set(0,1.2,0);g.add(flameLight);
  scene.add(g);S3.landmark=g;S3.beacon=bolt;
}

function winTex(floors,lit){
  const T=S3.T,key=floors+':'+lit;S3.wt=S3.wt||{};if(S3.wt[key])return S3.wt[key];
  const map=canvasTex(128,128,(x)=>{x.fillStyle='#f4ede0';x.fillRect(0,0,128,128);x.fillStyle='#2c3e4a';[[14,30],[74,30],[14,90],[74,90]].forEach(p=>x.fillRect(p[0],p[1],40,28));x.fillStyle='#e2d9c8';x.fillRect(0,60,128,6);x.fillRect(0,124,128,4)},{wrap:true});
  const em=canvasTex(128,128,(x)=>{x.fillStyle='#000';x.fillRect(0,0,128,128);x.fillStyle='#ffcf7a';[[14,30],[74,30],[14,90],[74,90]].forEach(p=>{if(Math.random()<lit)x.fillRect(p[0],p[1],40,28)})},{wrap:true});
  map.repeat.set(1.5,floors/2);em.repeat.set(1.5,floors/2);
  return S3.wt[key]={map:map,em:em};
}
function makeBuilding(level,col,mort){
  const T=S3.T,g=new T.Group(),dark=S3.dark;
  const roofMat=new T.MeshStandardMaterial({color:new T.Color(mort?'#8b908c':col),roughness:0.55});
  const wall=new T.MeshStandardMaterial({color:mort?0xa5a8a4:0xf6f0e3,roughness:0.75});
  const marble=new T.MeshStandardMaterial({color:mort?0xb0b2ae:0xfbf8f1,roughness:0.45});
  const stone=new T.MeshStandardMaterial({color:mort?0x9a9c98:0xd9ccb2,roughness:0.85});
  const add=(m,x,y,z)=>{m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m};
  const gable=(w,d,hgt,y,mat)=>{const G=new T.CylinderGeometry(hgt,hgt,w,3,1);G.rotateZ(Math.PI/2);const m=add(new T.Mesh(G,mat),0,y+hgt*0.5,0);m.scale.set(1,0.5,d/(hgt*1.73));return m};
  const win=(x,y,z)=>add(new T.Mesh(new T.BoxGeometry(0.08,0.1,0.02),new T.MeshStandardMaterial({color:0x2c3e4a,emissive:0xffb35a,emissiveIntensity:dark&&!mort?1.2:0})),x,y,z);
  if(level===0){ // whitewashed hut
    add(new T.Mesh(new T.BoxGeometry(0.46,0.3,0.42),wall),0,0.15,0);
    gable(0.52,0.48,0.18,0.3,roofMat);
    add(new T.Mesh(new T.BoxGeometry(0.1,0.17,0.02),new T.MeshStandardMaterial({color:0x2f5f8a})),0,0.085,0.215);
    win(0.15,0.18,0.215);
  }else if(level<5){ // villa: grows wider and taller with a colonnade
    const storeys=level<=2?1:2,w=0.5+level*0.06,d=0.46+level*0.04,hS=0.3;
    add(new T.Mesh(new T.BoxGeometry(w+0.12,0.06,d+0.16),stone),0,0.03,0);
    for(let s=0;s<storeys;s++){add(new T.Mesh(new T.BoxGeometry(w-s*0.12,hS,d-s*0.1),wall),0,0.06+hS/2+s*hS,-s*0.03);
      for(let q=0;q<2;q++)win(-w/4+q*w/2-s*0.03,0.06+hS*0.6+s*hS,(d-s*0.1)/2-s*0.03+0.005)}
    const topY=0.06+storeys*hS;gable(w-(storeys-1)*0.12+0.06,d-(storeys-1)*0.1+0.06,0.17,topY,roofMat);
    const nc=Math.min(2+level,6);for(let q=0;q<nc;q++)add(new T.Mesh(new T.CylinderGeometry(0.022,0.026,hS,8),marble),-w/2+0.04+q*(w-0.08)/(nc-1),0.06+hS/2,d/2+0.06);
    add(new T.Mesh(new T.BoxGeometry(w+0.04,0.035,0.12),roofMat),0,0.06+hS+0.017,d/2+0.04);
    if(level>=3){add(new T.Mesh(new T.CylinderGeometry(0.04,0.06,0.12,10),new T.MeshStandardMaterial({color:0xb0603a})),w/2-0.02,0.12,d/2+0.12)}
  }else{ // temple
    add(new T.Mesh(new T.BoxGeometry(0.86,0.06,0.86),stone),0,0.03,0);
    add(new T.Mesh(new T.BoxGeometry(0.78,0.06,0.78),marble),0,0.09,0);
    add(new T.Mesh(new T.BoxGeometry(0.7,0.06,0.7),marble),0,0.15,0);
    const cH=0.62,W=0.56;
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(i>0&&i<3&&j>0&&j<3)continue;add(new T.Mesh(new T.CylinderGeometry(0.035,0.042,cH,12),marble),-W/2+i*W/3,0.18+cH/2,-W/2+j*W/3)}
    add(new T.Mesh(new T.BoxGeometry(W*0.6,cH*0.85,W*0.6),new T.MeshStandardMaterial({color:mort?0x9a9c98:0xe8ddc9,roughness:0.7})),0,0.18+cH*0.42,0);
    add(new T.Mesh(new T.BoxGeometry(W+0.14,0.07,W+0.14),marble),0,0.18+cH+0.035,0);
    add(new T.Mesh(new T.BoxGeometry(W+0.16,0.04,W+0.16),roofMat),0,0.18+cH+0.09,0);
    gable(W+0.16,W+0.16,0.2,0.18+cH+0.11,roofMat);
    const b=new T.Mesh(new T.SphereGeometry(0.05,12,10),new T.MeshStandardMaterial({color:0xd4a833,metalness:0.9,roughness:0.25,envMap:S3.env||null}));b.position.y=0.18+cH+0.36;b.castShadow=true;g.add(b);
  }
  return g;
}
function makeSaleSign(i){

      if(!pc){pc=makePiece(p.tok);pc.userData.tok=p.tok;pc.position.copy(target);S3.pieces[p.id]=pc;S3.disp[p.id]=p.pos;return}
      const from=S3.disp[p.id];S3.disp[p.id]=p.pos;
      if(from===p.pos){if(!pc.userData.moving&&pc.position.distanceTo(target)>0.01){const a=pc.position.clone();anim(250,t=>pc.position.lerpVectors(a,target,ease(t)))}return}
      const steps=(p.pos-from+40)%40,path=[];
      if(steps>0&&steps<=12&&!p.inJail){for(let n=1;n<steps;n++)path.push(slotPos(from+n,0,false))}
      path.push(target);hopPath(pc,path);
    });
  }
  Object.keys(S3.pieces).forEach(id=>{if(!live.has(id)){S3.scene.remove(S3.pieces[id]);delete S3.pieces[id];delete S3.disp[id]}});
  if(sel!=null&&s){const c=cellCenter(sel),corner=sel%10===0,horiz=c.side==='b'||c.side==='t';S3.selMesh.visible=true;S3.selMesh.position.set(c.x,0.05,c.z);
    S3.selMesh.scale.set(corner?CORNER:horiz?1:CORNER,1,corner?CORNER:horiz?CORNER:1);
    if(SP[sel].t==='prop'){const p=lotPos(sel);S3.selLot.visible=true;S3.selLot.position.set(p.x,0.06,p.z)}else S3.selLot.visible=false}
  else{S3.selMesh.visible=false;S3.selLot.visible=false}
  if(s&&playing(s)){const pc=S3.pieces[cur(s).id];if(pc){S3.ring.visible=true;S3.ring.userData.follow=pc;ringFollow()}else S3.ring.visible=false}else S3.ring.visible=false;

function faceQuat(v,yaw){
  const T=S3.T,e={1:[0,0,0],6:[Math.PI,0,0],2:[-Math.PI/2,0,0],5:[Math.PI/2,0,0],3:[0,0,Math.PI/2],4:[0,0,-Math.PI/2]}[v]||[0,0,0];

function rollDice(d){

    const tq=faceQuat(d[k],rnd(-0.6,0.6)),axis=new T.Vector3(rnd(-1,1),rnd(-.3,.3),rnd(-1,1)).normalize(),spins=Math.PI*2*rnd(2.5,4);
    const end=S3.diceRest[k].clone().add(new T.Vector3(rnd(-.12,.12),0,rnd(-.12,.12))),start=end.clone().add(new T.Vector3(rnd(-.6,.6),3.2,rnd(.4,1.2)));
    if(reduce){m.quaternion.copy(tq);m.position.copy(end);return}
    anim(1150+k*140,t=>{const e=1-Math.pow(1-t,3);m.position.lerpVectors(start,end,e);
      const bounce=t<0.45?(1-t/0.45)*3.2:Math.abs(Math.sin((t-0.45)/0.55*Math.PI*2))*(1-t)*0.55;m.position.y=end.y+bounce;

  });
}
function hopPath(pc,path){

  const step=()=>{if(n>=path.length){pc.userData.moving=false;return}const a=pc.position.clone(),b=path[n++],long=a.distanceTo(b)>1.6;
    anim(long?560:170,t=>{pc.position.lerpVectors(a,b,t);pc.position.y=0.04+Math.sin(t*Math.PI)*(long?1.6:0.38)},step)};

}

async function mutate(fn){
  if(busy)return;busy=true;renderPanels();
  try{
    if(db.transact){const err=await db.transact('games/'+code,s=>{const e=fn(s);if(e)return e;s.rev=(s.rev||0)+1;s.updatedAt=Date.now()});if(err)toast(err);return}
    const ref=db.doc('games/'+code);
    for(let k=0;k<14;k++){
      const lease=await ref.acquire({holder:(me||'x')+':'+tabId,ttlMs:1500});
      if(!lease.acquired){await sleep(150+Math.random()*250);continue}
      const snap=await ref.get();if(!snap.exists)return;
      const s=JSON.parse(JSON.stringify(snap.data()));
      const err=fn(s);if(err){toast(err);return}
      s.rev=(s.rev||0)+1;s.updatedAt=Date.now();
      await ref.set(s);return;
    }

}

    if(sp.t==='prop'){
      const t=rentTable(sp),lv=o?o.h:-1,full=o&&ownsGroup(s,sp.g,o.o);
      const rows=[['Rent',t[0]],['Rent with the full set',t[0]*2],['With 1 villa',t[1]],['With 2 villas',t[2]],['With 3 villas',t[3]],['With 4 villas',t[4]],['With a temple',t[5]]];
      const on=lv<0?-1:lv===0?(full?1:0):lv+1;
      h+='<table class="rent">'+rows.map((r,k)=>'<tr'+(k===on&&!(o&&o.m)?' class="on"':'')+'><td>'+r[0]+'</td><td>🪙'+r[1]+'</td></tr>').join('')+'</table>';
      h+='<div class="muted" style="font-size:13px">Villas cost 🪙'+houseCost(sel)+' each. Mortgage value 🪙'+sp.p/2+'.</div>';
    }else if(sp.t==='rail')h+='<table class="rent"><tr><td>1 station</td><td>🪙25</td></tr><tr><td>2 stations</td><td>🪙50</td></tr><tr><td>3 stations</td><td>🪙100</td></tr><tr><td>All 4</td><td>🪙200</td></tr></table>';
    else h+='<div class="muted">Rent is 4× the dice roll, or 10× if you own both the Forge of Hephaestus and the Sacred Spring.</div>';
    if(o&&o.o===me&&playing(s)){
      const b=[];
      if(sp.t==='prop'&&ownsGroup(s,sp.g,me)&&o.h<5&&!o.m)b.push('<button class="btn small primary" data-act="build" data-arg="'+sel+'">'+(o.h===4?'Build temple':'Build villa')+' (🪙'+houseCost(sel)+')</button>');
      if(o.h)b.push('<button class="btn small" data-act="sell" data-arg="'+sel+'">Sell a building (+🪙'+houseCost(sel)/2+')</button>');
      if(!o.m&&!o.h)b.push('<button class="btn small" data-act="mort" data-arg="'+sel+'">Mortgage (+🪙'+sp.p/2+')</button>');
      if(o.m)b.push('<button class="btn small" data-act="unmort" data-arg="'+sel+'">Pay off mortgage (🪙'+unmortCost(sel)+')</button>');
      if(b.length)h+='<div class="row">'+b.join('')+'</div>';
    }
  }else{
    const txt={go:'Collect 🪙200 from Zeus every time you pass.',tax:'Pay 🪙'+(sp.amt||0)+' to the bank.',fortune:'Draw a card from the Fates.',whip:'Ask the Oracle and draw a card.',jail:'Just passing, unless Polyphemus caught you.',free:'Eat the lotus and rest. Nothing happens.',gojail:'Captured! Go straight to the Cyclops\' Cave. Do not pass Olympus.'}[sp.t];
    h+='<div>'+txt+'</div>';
  }
  return h+'</div>';
}
function tradeHTML(){
  const s=state,mine=P(s,me);if(!playing(s))return '';
  const t=s.trade;let h='<div class="panel"><span class="label">Trading</span>';
  const desc=(ids,cash)=>{const a=ids.map(i=>'<b>'+esc(SP[i].n)+'</b>');if(cash)a.push('<span class="money">🪙'+cash+'</span>');return a.join(', ')||'nothing'};
  if(t){
    h+='<div>'+who(t.from)+' offers '+desc(t.give,t.giveCash)+' to '+who(t.to)+' for '+desc(t.get,t.getCash)+'.</div>';
    if(t.to===me)h+='<div class="row"><button class="btn small primary" data-act="accept"'+(busy?' disabled':'')+'>Accept</button><button class="btn small" data-act="decline">Turn down</button></div>';
    else if(t.from===me)h+='<div class="row"><button class="btn small" data-act="decline">Withdraw offer</button></div>';
    return h+'</div>';
  }
  if(!mine||mine.bankrupt||canWrite===false)return h+'<div class="muted">No trade on the table.</div></div>';
  if(!tradeOpen)return h+'<div class="row"><button class="btn small" data-act="tradeopen">Propose a trade</button></div></div>';
  const others=s.players.filter(p=>!p.bankrupt&&p.id!==me);
  if(!draft.to||!others.some(p=>p.id===draft.to))draft.to=others[0]?others[0].id:'';
  const myT=Object.keys(s.props).map(Number).filter(i=>tradeable(s,i,me)),thT=Object.keys(s.props).map(Number).filter(i=>draft.to&&tradeable(s,i,draft.to));
  const box=(list,key)=>list.length?list.map(i=>'<label><input type="checkbox" id="tr-'+key+'-'+i+'" data-tr="'+key+'" value="'+i+'"'+(draft[key].includes(i)?' checked':'')+'>'+esc(SP[i].n)+'</label>').join(''):'<span class="muted" style="font-size:12px">No lands to trade</span>';
  h+='<label class="label" for="tr-to">Trade with</label><select id="tr-to">'+others.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===draft.to?' selected':'')+'>'+esc(TOKS[p.tok].g+' '+nameOf(p.id))+'</option>').join('')+'</select>'+
    '<div class="tradegrid"><fieldset><legend>You give</legend>'+box(myT,'give')+'<label for="tr-gc">Cash 🪙</label><input id="tr-gc" type="number" min="0" step="10" value="'+esc(draft.giveCash)+'"></fieldset>'+
    '<fieldset><legend>You get</legend>'+box(thT,'get')+'<label for="tr-tc">Cash 🪙</label><input id="tr-tc" type="number" min="0" step="10" value="'+esc(draft.getCash)+'"></fieldset></div>'+
    '<div class="row"><button class="btn small primary" data-act="propose"'+(busy?' disabled':'')+'>Send offer</button><button class="btn small" data-act="tradeclose">Cancel</button></div>';
  return h+'</div>';
}
function logHTML(){return '<div class="panel"><span class="label">What\'s happened</span><div class="log">'+state.log.slice(-40).reverse().map(l=>'<div>'+fmt(l)+'</div>').join('')+'</div></div>'}

// ================= Sound & feedback =================
let AC=null,muted=load('mgo-mute')==='1';
function ac(){if(muted)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||0.15,a.currentTime+t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05)}
function noise(t0,dur,vol){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;s.buffer=b;g.gain.value=vol||0.35;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
const SFX={
  dice(){for(let k=0;k<6;k++)noise(0.08+k*0.11+Math.random()*0.04,0.06,0.3-k*0.04)},
  coin(){tone(1320,0,0.12,'triangle',0.12);tone(1760,0.07,0.18,'triangle',0.1)},
  pay(){tone(520,0,0.14,'triangle',0.12);tone(390,0.09,0.2,'triangle',0.1)},
  turn(){tone(659,0,0.25,'sine',0.14);tone(880,0.12,0.25,'sine',0.12);tone(1175,0.24,0.35,'sine',0.1)},
  build(){tone(330,0,0.1,'square',0.05);tone(494,0.08,0.1,'square',0.05);tone(659,0.16,0.18,'square',0.05)}
};
let prevSnap=null;
function feedback(s){
  const p=prevSnap;prevSnap={rollId:s.rollId,turn:s.turn,status:s.status,cash:Object.fromEntries(s.players.map(q=>[q.id,q.cash])),h:Object.values(s.props).reduce((a,o)=>a+(o.h||0),0)};
  if(!p||!me)return;
  if(s.rollId!==p.rollId)SFX.dice();
  const mine=P(s,me);
  if(mine&&p.cash[me]!=null&&mine.cash!==p.cash[me]){const d=mine.cash-p.cash[me];setTimeout(()=>{d>0?SFX.coin():SFX.pay();popMoney(d)},s.rollId!==p.rollId?1100:0)}
  if(prevSnap.h>p.h)SFX.build();
  if(s.status==='playing'&&cur(s).id===me&&(p.turn!==s.turn||p.status!=='playing')){SFX.turn();try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){};flashTitle()}
}
function popMoney(d){const c=document.querySelector('.hdr .cash');if(!c)return;const r=c.getBoundingClientRect();const el=document.createElement('div');el.className='pop '+(d>0?'up':'down');el.textContent=(d>0?'+':'−')+'🪙'+Math.abs(d);el.style.left=(r.left+4)+'px';el.style.top=(r.bottom+4)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}
let titleT=null;function flashTitle(){if(!document.hidden)return;let k=0;clearInterval(titleT);titleT=setInterval(()=>{document.title=(k++%2)?'Your turn! · M.Go':'M.Go';if(!document.hidden){clearInterval(titleT);document.title='M.Go'}},1000)}
function setMuteBtn(){const b=$('mutebtn');if(b){b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-pressed',String(!muted))}}

// ================= Events =================
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,arg=b.dataset.arg;
  if(a==='view'){S3.userMoved=true;setView(arg);return}
  if(a==='dock'){collapsed=!collapsed;renderPanels();return}
  if(a==='invite'){const url=location.origin+location.pathname+'#'+code,txt='Join my M.Go table '+code;if(navigator.share){navigator.share({title:'M.Go',text:txt,url:url}).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Invite link copied. Paste it to your friends.')).catch(()=>toast('Send this link: '+url))}return}
  if(a==='mute'){muted=!muted;store('mgo-mute',muted?'1':'0');setMuteBtn();if(!muted)SFX.coin();return}
  if(a==='tab'){if(tab===arg&&!collapsed)collapsed=true;else{tab=arg;collapsed=false}renderPanels();return}
  if(a==='sel'){sel=sel===+arg?null:+arg;if(sel!=null){tab='streets';collapsed=false}renderPanels();syncScene();return}
  if(a==='desel'){sel=null;renderPanels();syncScene();return}
  if(a==='home'){closeGame();return}
  if(a==='open'){openGame(arg);return}
  if(a==='new'){createGame();return}
  if(a==='tradeopen'){tradeOpen=true;draft={to:'',give:[],get:[],giveCash:0,getCash:0};renderPanels();return}
  if(a==='tradeclose'){tradeOpen=false;renderPanels();return}
  if(a==='askresign'){confirmResign=true;renderPanels();return}
  if(a==='noresign'){confirmResign=false;renderPanels();return}
  if(a==='resign')confirmResign=false;
  if(a==='leave'){mutate(s=>A.leave(s)).then(closeGame);return}
  if(a==='propose'){const t={to:draft.to,give:draft.give.slice(),get:draft.get.slice(),giveCash:Math.max(0,Math.floor(+draft.giveCash||0)),getCash:Math.max(0,Math.floor(+draft.getCash||0))};
    mutate(s=>A.propose(s,t)).then(()=>{if(state&&state.trade&&state.trade.from===me){tradeOpen=false;renderPanels()}});return}
  if(A[a])mutate(s=>A[a](s,arg));
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nick')nickDraft=t.value;
  else if(t.id==='tr-gc')draft.giveCash=t.value;
  else if(t.id==='tr-tc')draft.getCash=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='nick'){const v=t.value;store('mgo-nick',v.trim().slice(0,16));mutate(s=>A.nick(s,v)).then(()=>{nickDraft=null})}
  else if(t.id==='tr-to'){draft.to=t.value;draft.get=[];renderPanels()}
  else if(t.dataset&&t.dataset.tr){const k=t.dataset.tr,i=+t.value;draft[k]=t.checked?draft[k].concat(i):draft[k].filter(x=>x!==i)}
});

render();
boot().catch(()=>{bootDone=true;render()});
</script>
