<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f86d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M.Go">
<meta name="description" content="A 3D property-trading board game set in Homer's Aegean. Play live with friends on your phones.">
<meta property="og:title" content="M.Go">
<meta property="og:description" content="A 3D property-trading board game set in Homer's Aegean. Play live with friends on your phones.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>M.Go</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>/* Layout: full-screen 3D board; a player strip on top, a big thumb-zone action bar at the bottom, sheets and pop-up cards over the board. Toy-like: chunky rounded type, 3D press buttons. */
:root{
  --ink:#23263a; --ink-2:#5b6080; --panel:#ffffff; --panel-2:#f3f5fb; --line:#dfe3f0;
  --gold:#ffc93c; --gold-d:#d99a0b; --green:#3ccf5e; --green-d:#22a043; --red:#ff5a4e; --red-d:#cc3227; --blue:#2f86d8; --blue-d:#1d5fa3;
  --shadow:0 10px 30px rgba(20,30,70,.25);
  --display:'Lilita One','Arial Rounded MT Bold',Impact,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f1f3ff;--ink-2:#aab1d6;--panel:#1d2244;--panel-2:#262c56;--line:#353c6e;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f1f3ff;--ink-2:#aab1d6;--panel:#1d2244;--panel-2:#262c56;--line:#353c6e;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#7fc8f5}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
input,select{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stagewrap{position:fixed;inset:0;z-index:0}
.stage{position:absolute;inset:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font-weight:800}
.money{font-variant-numeric:tabular-nums;font-weight:900}

/* ---- top: menu + player strip ---- */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.top>*{pointer-events:auto}
.ibtn{width:46px;height:46px;flex:0 0 46px;border-radius:16px;border:0;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 rgba(20,30,70,.18),var(--shadow);display:grid;place-items:center;font-size:20px;cursor:pointer}
.ibtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(20,30,70,.18)}
.logo{font-family:var(--display);font-size:26px;letter-spacing:.02em;background:var(--panel);padding:6px 14px;border-radius:16px;box-shadow:0 4px 0 rgba(20,30,70,.18),var(--shadow)}
.logo b{color:var(--blue);font-weight:400}
.strip{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px}
.strip::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:0 4px 0 rgba(20,30,70,.15),var(--shadow);border:0;cursor:pointer;position:relative;transition:transform .2s}
.pchip .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pchip .nm{font-weight:900;font-size:12px;line-height:1.1;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pchip .cs{font-weight:900;font-size:14px;line-height:1.1}
.pchip.cur{transform:scale(1.06);box-shadow:0 0 0 3px var(--gold),0 4px 0 rgba(20,30,70,.15),var(--shadow)}
.pchip.cur::after{content:"";position:absolute;left:22px;bottom:-9px;border:7px solid transparent;border-top-color:var(--gold)}
.pchip.out{opacity:.45;filter:grayscale(1)}
.pchip .neg{color:var(--red)}

/* ---- right rail: camera + sound ---- */
.rail{position:fixed;right:12px;z-index:4;display:flex;flex-direction:column;gap:8px}
.rail .ibtn{width:42px;height:42px;flex-basis:42px;border-radius:14px;font-size:18px}

/* ---- banners ---- */
.banners{position:fixed;left:50%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px);pointer-events:none}
.banner{background:var(--panel);border-radius:16px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:var(--shadow);animation:bIn .35s cubic-bezier(.2,1.4,.4,1);max-width:100%;text-align:center}
.banner.out{animation:bOut .3s ease-in forwards}
.banner .g{font-size:16px}
@keyframes bIn{from{transform:translateY(-14px) scale(.9);opacity:0}}
@keyframes bOut{to{transform:translateY(-10px);opacity:0}}

/* ---- bottom action bar ---- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.bottom>*{pointer-events:auto}
.status{background:rgba(255,255,255,.92);color:#23263a;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;box-shadow:var(--shadow);max-width:min(94vw,460px);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:460px}
.rbtn{width:58px;height:58px;border-radius:20px;border:0;background:var(--panel);color:var(--ink);box-shadow:0 5px 0 rgba(20,30,70,.2),var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:22px;cursor:pointer;position:relative}
.rbtn span{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.rbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,30,70,.2)}
.rbtn .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 var(--red-d)}
.main{width:118px;height:118px;border-radius:50%;border:4px solid #fff;font-family:var(--display);font-size:26px;letter-spacing:.03em;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:radial-gradient(circle at 35% 30%,#ffe27a,var(--gold) 55%,var(--gold-d));box-shadow:0 8px 0 #b27b05,0 14px 30px rgba(0,0,0,.35);margin-bottom:6px;transition:transform .08s}
.main .ic{font-size:34px;margin-bottom:4px;text-shadow:none}
.main small{font-family:var(--body);font-weight:900;font-size:13px;margin-top:3px}
.main:active{transform:translateY(5px);box-shadow:0 3px 0 #b27b05,0 8px 20px rgba(0,0,0,.3)}
.main.green{background:radial-gradient(circle at 35% 30%,#8ff0a4,var(--green) 55%,var(--green-d));box-shadow:0 8px 0 #18773a,0 14px 30px rgba(0,0,0,.35)}
.main.red{background:radial-gradient(circle at 35% 30%,#ffa59c,var(--red) 55%,var(--red-d));box-shadow:0 8px 0 #962015,0 14px 30px rgba(0,0,0,.35)}
.main.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.main:disabled{filter:grayscale(.6);opacity:.7;animation:none}
.wait{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 5px 0 rgba(20,30,70,.18),var(--shadow);font-weight:900;margin-bottom:6px;min-height:58px}
.wait .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.wait .dots::after{content:"…";animation:dots 1.2s steps(3) infinite}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---- generic buttons ---- */
.btn{border:0;border-radius:16px;padding:12px 18px;font-family:var(--display);font-size:18px;letter-spacing:.02em;color:#fff;cursor:pointer;min-height:50px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);text-shadow:0 1px 0 rgba(0,0,0,.2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold-d);color:#4a3100;text-shadow:none}
.btn.gold:active{box-shadow:0 2px 0 var(--gold-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 var(--line);text-shadow:none}
.btn.small{min-height:40px;font-size:15px;padding:8px 14px;border-radius:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--blue);font-weight:800;text-decoration:underline;cursor:pointer;padding:4px}

/* ---- cards (home, lobby) ---- */
.card{width:100%;max-width:460px;background:var(--panel);border-radius:26px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:62vh;max-height:62dvh;overflow:auto}
.card h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;margin:0}
.card h1 b{color:var(--blue);font-weight:400}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.card p{margin:0;color:var(--ink-2)}
.label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.tbl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:16px;background:var(--panel-2)}
.code{font-family:var(--display);font-size:20px;letter-spacing:.12em}
.empty{padding:14px;border:2px dashed var(--line);border-radius:16px;color:var(--ink-2);text-align:center}
.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pieces button{border:0;border-radius:16px;background:var(--panel-2);padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:12px;box-shadow:0 4px 0 var(--line);min-height:64px}
.pieces button .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.pieces button[aria-pressed=true]{box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--line)}
.pieces button:disabled{opacity:.3}
input[type=text],input[type=number],select{width:100%;border:2px solid var(--line);background:var(--panel-2);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:800;min-height:48px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--panel-2)}
.prow .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:0 0 38px}
.prow .nm{flex:1;min-width:0;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:12px;font-weight:700;color:var(--ink-2)}
.prow.cur{box-shadow:inset 0 0 0 3px var(--gold)}
.prow.out{opacity:.5}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(15,20,45,.35);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;pointer-events:none}
.sheet .sbody{pointer-events:auto;width:100%;max-width:520px;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:var(--shadow);padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:78vh;max-height:78dvh;overflow:auto;animation:up .3s cubic-bezier(.2,1.2,.4,1);display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40%);opacity:.3}}
.sheet .grab{align-self:center;width:52px;height:24px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sheet .grab::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shead h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.x{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel-2);font-size:18px;font-weight:900;cursor:pointer;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:flex;align-items:center;gap:8px;border:0;background:var(--panel-2);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:left}
.lchip i{width:12px;height:28px;border-radius:5px;flex:0 0 12px}
.lchip small{display:block;font-size:11px;color:var(--ink-2);font-weight:800}
.lchip.m{opacity:.6}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.log div{padding:8px 10px;border-radius:12px;background:var(--panel-2)}
.warn{color:var(--red);font-weight:900}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid fieldset{border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.tgrid legend{font-weight:900;font-size:13px;padding:0 4px}
.tgrid label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;min-height:30px}
.tgrid input[type=checkbox]{width:20px;height:20px}

/* ---- deed card ---- */
.deed{border-radius:20px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 3px var(--line)}
.deed .hd{padding:14px 16px 12px;color:#fff;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.deed .hd .gl{font-size:34px;line-height:1}
.deed .hd h3{font-family:var(--display);font-weight:400;font-size:26px;margin:4px 0 0;line-height:1}
.deed .hd small{font-weight:900;opacity:.9;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.deed .bd{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.rent{width:100%;border-collapse:collapse;font-size:14px;font-weight:700}
.rent td{padding:5px 0;border-bottom:1px dashed var(--line)}
.rent td:last-child{text-align:right;font-weight:900}
.rent tr.on td{color:var(--blue)}
.deed .own{display:flex;align-items:center;gap:8px;font-weight:900}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,20,45,.45);animation:fade .2s}
.mcard{width:100%;max-width:360px;background:var(--panel);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.4);padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop .4s cubic-bezier(.2,1.5,.4,1);max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.mcard .btns{display:flex;gap:10px}
.mcard .btns .btn{flex:1}
.fate{perspective:900px}
.fate .inner{position:relative;width:100%;aspect-ratio:3/4;max-height:56vh;margin:0 auto;transform-style:preserve-3d;animation:flip .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes flip{from{transform:rotateY(180deg) scale(.7)}}
.fate .face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;color:#fff;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.fate .face.fortune{background:radial-gradient(circle at 50% 25%,#ffe27a,#f4a91c 60%,#c47a06);border:5px solid #fff3c4}
.fate .face.whip{background:radial-gradient(circle at 50% 25%,#7ff0e0,#1fb2aa 60%,#0e7a74);border:5px solid #c9fff7}
.fate .face .big{font-size:64px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.fate .face h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.fate .face p{font-weight:900;font-size:19px;margin:0;line-height:1.3;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.fate .face .by{font-size:13px;font-weight:800;opacity:.9}
.win h2{font-family:var(--display);font-weight:400;font-size:36px;text-align:center;margin:0}
.win .av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:52px;margin:0 auto;box-shadow:0 0 0 6px var(--gold)}

/* ---- toast & coins ---- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 80px);transform:translateX(-50%);z-index:40;background:#23263a;color:#fff;font-weight:800;padding:10px 16px;border-radius:14px;max-width:min(92vw,420px);box-shadow:var(--shadow);text-align:center}
.coin{position:fixed;z-index:35;font-size:22px;pointer-events:none;animation:coin 1s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes coin{to{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.pop{position:fixed;z-index:35;font-weight:900;font-size:18px;pointer-events:none;animation:popUp 1.4s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.pop.up{color:#1fae4a}.pop.down{color:#e2342c}
@keyframes popUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{transform:scale(1.15);opacity:1}100%{transform:translateY(-36px);opacity:0}}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}

/* ---- phone landscape: action column on the right, sheets slide in from the right ---- */
@media (orientation:landscape) and (max-height:520px){
  .top{right:150px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:calc(env(safe-area-inset-left,0px) + 10px)}
  .pchip .av{width:30px;height:30px;font-size:16px}
  .ibtn{width:40px;height:40px;flex-basis:40px;border-radius:14px}
  .rail{right:auto;left:calc(env(safe-area-inset-left,0px) + 10px)}
  .rail .ibtn{width:38px;height:38px;flex-basis:38px}
  .bottom{left:auto;top:0;right:0;width:auto;justify-content:center;padding:8px calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 8px) 0}
  .bottom .status{display:none}
  .bar{flex-direction:column;align-items:center;gap:6px;max-width:none;width:auto}
  .rbtn{width:50px;height:46px;border-radius:15px;font-size:18px}
  .rbtn span{font-size:9px}
  .main{width:96px;height:96px;font-size:21px;margin:4px 0 10px}
  .main .ic{font-size:26px}
  .wait{flex-direction:column;border-radius:22px;padding:8px;min-height:0;font-size:13px;text-align:center;max-width:110px}
  .pills{flex-direction:column}
  .bottom .card{width:min(380px,48vw);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  .card h1{font-size:34px}
  .sheet{left:auto;top:0;justify-content:flex-end}
  .sheet .sbody{width:min(420px,60vw);height:100%;max-height:none;border-radius:24px 0 0 24px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-right:calc(env(safe-area-inset-right,0px) + 16px);animation-name:slideL}
  .sheet .grab{display:none}
  .modal{padding:10px}
  .mcard{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
  .fate .inner{aspect-ratio:4/3;max-height:80vh}
  .banners{left:auto;right:150px;transform:none;width:min(50vw,380px)}
  #toast{top:calc(env(safe-area-inset-top,0px) + 60px)}
}
@keyframes slideL{from{transform:translateX(50%);opacity:.3}}
@media (min-width:900px){.card{max-height:none}.main{width:128px;height:128px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<div id="stageSlot" class="stagewrap"></div>
<header class="top" id="top"></header>
<div class="rail" id="rail"></div>

<script>
// ================= Board data =================
const GC=['#8a5a2b','#1fb5d6','#e0388f','#f28c1a','#e2312b','#f5c400','#18a558','#2448c8'];
const SP=[
 {n:'Mount Olympus',t:'go',ic:'⚡'},
 {n:'Ogygia Cove',t:'prop',g:0,p:60},{n:'Oracle',t:'whip',ic:'👁'},{n:'Aiaia Isle',t:'prop',g:0,p:60},
 {n:"Agamemnon's Tribute",t:'tax',amt:200,ic:'🏺'},{n:'Harbour of Aulis',t:'rail',p:200,ic:'⛵'},
 {n:'Ithaca Harbour',t:'prop',g:1,p:100},{n:'The Fates',t:'fortune',ic:'🧵'},{n:'Mount Neriton',t:'prop',g:1,p:100},{n:"Eumaeus's Farm",t:'prop',g:1,p:120},
 {n:"Cyclops' Cave",t:'jail',ic:'👁'},
 {n:'Pylos Beach',t:'prop',g:2,p:140},{n:'Forge of Hephaestus',t:'util',p:150,ic:'🔥'},{n:"Nestor's Palace",t:'prop',g:2,p:140},{n:'Messene',t:'prop',g:2,p:160},
 {n:'Harbour of Tenedos',t:'rail',p:200,ic:'⛵'},
 {n:'Scheria Shore',t:'prop',g:3,p:180},{n:'Oracle',t:'whip',ic:'👁'},{n:'Gardens of Alcinous',t:'prop',g:3,p:180},{n:'Phaeacian Hall',t:'prop',g:3,p:200},
 {n:'Lotus Isle',t:'free',ic:'🌸'},
 {n:'Argos',t:'prop',g:4,p:220},{n:'The Fates',t:'fortune',ic:'🧵'},{n:'Tiryns',t:'prop',g:4,p:220},{n:'Nemea',t:'prop',g:4,p:240},
 {n:'Harbour of Crete',t:'rail',p:200,ic:'⛵'},
 {n:'Sparta',t:'prop',g:5,p:260},{n:'Amyklai',t:'prop',g:5,p:260},{n:'Sacred Spring',t:'util',p:150,ic:'💧'},{n:"Menelaus's Palace",t:'prop',g:5,p:280},
 {n:'Captured!',t:'gojail',ic:'⛓'},
 {n:'Plain of Scamander',t:'prop',g:6,p:300},{n:'Walls of Troy',t:'prop',g:6,p:300},{n:'Oracle',t:'whip',ic:'👁'},{n:"Priam's Citadel",t:'prop',g:6,p:320},
 {n:'Harbour of Rhodes',t:'rail',p:200,ic:'⛵'},{n:'The Fates',t:'fortune',ic:'🧵'},
 {n:'The Lion Gate',t:'prop',g:7,p:350},{n:"Poseidon's Offering",t:'tax',amt:100,ic:'🔱'},{n:'Citadel of Mycenae',t:'prop',g:7,p:400}
];
const GROUP={};SP.forEach((s,i)=>{if(s.t==='prop')(GROUP[s.g]=GROUP[s.g]||[]).push(i)});
const RAILS=SP.map((s,i)=>s.t==='rail'?i:-1).filter(i=>i>=0);
const UTILS=SP.map((s,i)=>s.t==='util'?i:-1).filter(i=>i>=0);
const BUYABLE=t=>t==='prop'||t==='rail'||t==='util';
const MULT=[1,5,14,38,50,62];
const baseRent=sp=>Math.max(2,Math.round(sp.p*0.07));
const rentTable=sp=>MULT.map(m=>baseRent(sp)*m);
const houseCost=i=>i<10?50:i<20?100:i<30?150:200;
const unmortCost=i=>Math.ceil(SP[i].p*0.55);
const TOKS={
  pawn:{n:'Helmet',g:'⛑',c:'#d8433b'}, cone:{n:'Amphora',g:'🏺',c:'#e07a2a'}, cube:{n:'Horse',g:'🐴',c:'#b07a3c'}, gem:{n:'Trident',g:'🔱',c:'#2f86d8'},
  ring:{n:'Laurel',g:'🌿',c:'#35a85a'}, star:{n:'Shield',g:'🛡',c:'#9b59d0'}, capsule:{n:'Owl',g:'🦉',c:'#1fb2aa'}, pyramid:{n:'Column',g:'🏛',c:'#e0559f'}
};
const TOKENS=Object.keys(TOKS);

const FORTUNE=[
 {t:'Zeus summons you. Advance to Mount Olympus and collect 🪙200.',a:'move',to:0},
 {t:'Agamemnon calls the kings. Sail to the Citadel of Mycenae.',a:'move',to:39},
 {t:'Menelaus needs you in Sparta. Collect 🪙200 if you pass Olympus.',a:'move',to:26},
 {t:'Poseidon\'s winds drive you to the nearest harbour. Pay the owner double.',a:'station'},
 {t:'The Sirens sing. You drift back 3 spaces.',a:'back',n:3},
 {t:'Polyphemus grabs you. Go straight to the Cyclops\' Cave.',a:'jail'},
 {t:'Athena guides you out. Escape the Cyclops\' Cave free. Keep this until you need it.',a:'free'},
 {t:'Your share of the plunder from Troy. Collect 🪙150.',a:'cash',n:150},
 {t:'Hermes brings a gift. Collect 🪙50.',a:'cash',n:50},
 {t:'Pay the ferryman 🪙15.',a:'cash',n:-15},
 {t:'Poseidon shakes the earth. Pay 🪙25 per villa and 🪙100 per temple.',a:'repairs',h:25,H:100},
 {t:'You host a feast for the Achaean kings. Pay each player 🪙50.',a:'each',n:-50}
];
const WHIP=[
 {t:'The Oracle sends you to Mount Olympus. Collect 🪙200.',a:'move',to:0},
 {t:'The gods return your libation. Collect 🪙20.',a:'cash',n:20},
 {t:'The suitors eat through your stores. Pay 🪙40.',a:'cash',n:-40},
 {t:'You find a golden cup in the sand. Collect 🪙10.',a:'cash',n:10},
 {t:'Your chariot wheel breaks. Pay 🪙100.',a:'cash',n:-100},
 {t:'Second place in the chariot race. Collect 🪙25.',a:'cash',n:25},
 {t:'A hero leaves you his armour. Collect 🪙100.',a:'cash',n:100},
 {t:'It\'s your feast day. Collect 🪙10 from every player.',a:'each',n:10},
 {t:'You sell a jar of olive oil. Collect 🪙45.',a:'cash',n:45},
 {t:'Athena guides you out. Escape the Cyclops\' Cave free. Keep this until you need it.',a:'free'},
 {t:'A storm cracks your ship\'s mast. Pay 🪙50.',a:'cash',n:-50},
 {t:'Repair the city walls. Pay 🪙40 per villa and 🪙115 per temple.',a:'repairs',h:40,H:115},
 {t:'You angered Poseidon. Go straight to the Cyclops\' Cave.',a:'jail'}
];

// ================= Rules engine =================
let me=null;
const r6=()=>1+Math.floor(Math.random()*6);
const P=(s,id)=>s.players.find(p=>p.id===id);
const cur=s=>s.players[s.turn];
const pt=id=>'{{p:'+id+'}}', st=i=>'{{s:'+i+'}}';
function L(s,t){s.log.push(t);if(s.log.length>80)s.log=s.log.slice(-80)}
function payTo(s,p,amt,toId){p.cash-=amt;if(toId){const q=P(s,toId);if(q)q.cash+=amt}if(p.cash<0)p.creditor=toId||null}
const ownsGroup=(s,g,id)=>GROUP[g].every(j=>s.props[j]&&s.props[j].o===id);
function rentFor(s,i){
  const sp=SP[i],o=s.props[i];if(!o||o.m)return 0;
  if(sp.t==='prop'){const t=rentTable(sp);if(o.h>0)return t[o.h];return t[0]*(ownsGroup(s,sp.g,o.o)?2:1)}
  if(sp.t==='rail'){const c=RAILS.filter(j=>s.props[j]&&s.props[j].o===o.o).length;return [25,50,100,200][c-1]}
  if(sp.t==='util'){const c=UTILS.filter(j=>s.props[j]&&s.props[j].o===o.o).length;return (s.dice[0]+s.dice[1])*(c===2?10:4)}
  return 0;
}
function moveBy(s,p,n){const np=p.pos+n;if(np>=40){p.cash+=200;L(s,pt(p.id)+' passed Mount Olympus and collected 🪙200.')}p.pos=np%40}
function moveTo(s,p,to){if((to<p.pos||to===0)&&p.pos!==0){p.cash+=200;L(s,pt(p.id)+' passed Mount Olympus and collected 🪙200.')}p.pos=to}
function toJail(s,p){p.pos=10;p.inJail=true;p.jailTurns=0;s.lastDoubles=false;s.dbl=0;L(s,pt(p.id)+" was thrown into the Cyclops' Cave.")}
function land(s,p,opt){
  opt=opt||{};const i=p.pos,sp=SP[i];
  if(BUYABLE(sp.t)){
    const o=s.props[i];
    if(!o){s.phase='buy';s.pending=i;return}
    if(o.o===p.id)return;
    if(o.m){L(s,st(i)+' is mortgaged, so no rent is due.');return}
    let r=rentFor(s,i);if(opt.double)r*=2;
    payTo(s,p,r,o.o);L(s,pt(p.id)+' paid '+pt(o.o)+' 🪙'+r+' rent for '+st(i)+'.');return;
  }
  if(sp.t==='tax'){payTo(s,p,sp.amt,null);L(s,pt(p.id)+' paid 🪙'+sp.amt+' '+sp.n+'.');return}
  if(sp.t==='fortune'||sp.t==='whip'){drawCard(s,p,sp.t);return}
  if(sp.t==='gojail'){L(s,pt(p.id)+' got nicked!');toJail(s,p)}
}
function drawCard(s,p,deck){
  const D=deck==='fortune'?FORTUNE:WHIP,c=D[Math.floor(Math.random()*D.length)];
  s.card={deck:deck,t:c.t,by:p.id};
  L(s,pt(p.id)+' drew '+(deck==='fortune'?'The Fates':'The Oracle')+': '+c.t);
  if(c.a==='move'){moveTo(s,p,c.to);land(s,p)}
  else if(c.a==='back'){p.pos=(p.pos+40-c.n)%40;land(s,p)}
  else if(c.a==='station'){let j=p.pos;do{j=(j+1)%40}while(SP[j].t!=='rail');moveTo(s,p,j);land(s,p,{double:true})}
  else if(c.a==='jail')toJail(s,p);
  else if(c.a==='free')p.free=(p.free||0)+1;
  else if(c.a==='cash'){if(c.n>=0)p.cash+=c.n;else payTo(s,p,-c.n,null)}
  else if(c.a==='each'){s.players.forEach(q=>{if(q.id===p.id||q.bankrupt)return;if(c.n<0)payTo(s,p,-c.n,q.id);else payTo(s,q,c.n,p.id)})}
  else if(c.a==='repairs'){let h=0,H=0;Object.values(s.props).forEach(o=>{if(o.o!==p.id)return;if(o.h===5)H++;else h+=o.h});const amt=h*c.h+H*c.H;if(amt)payTo(s,p,amt,null);L(s,pt(p.id)+' paid 🪙'+amt+' for repairs.')}
}
function afterMove(s,p){if(s.phase==='buy')return;s.phase=(!p.inJail&&s.lastDoubles)?'roll':'end'}
function nextTurn(s){
  const n=s.players.length;let k=s.turn;
  for(let j=0;j<n;j++){k=(k+1)%n;if(!s.players[k].bankrupt)break}
  s.turn=k;s.phase='roll';s.dbl=0;s.lastDoubles=false;s.pending=null;
}
function bankrupt(s,p){
  const c=p.creditor&&P(s,p.creditor)&&!P(s,p.creditor).bankrupt&&p.creditor!==p.id?p.creditor:null;
  Object.keys(s.props).forEach(k=>{const o=s.props[k];if(o.o!==p.id)return;const half=o.h*houseCost(+k)/2;o.h=0;if(c){o.o=c;P(s,c).cash+=half}else delete s.props[k]});
  if(c&&p.free)P(s,c).free=(P(s,c).free||0)+p.free;
  const wasTurn=cur(s).id===p.id;
  p.bankrupt=true;p.cash=0;p.free=0;p.inJail=false;
  L(s,pt(p.id)+' is bankrupt'+(c?'. Everything goes to '+pt(c)+'.':'. Their lands go back to the gods.'));
  if(s.trade&&(s.trade.from===p.id||s.trade.to===p.id))s.trade=null;
  const alive=s.players.filter(q=>!q.bankrupt);
  if(alive.length===1){s.status='over';s.winner=alive[0].id;s.phase='';L(s,pt(alive[0].id)+' rules the Aegean and wins the game!');return}
  if(wasTurn)nextTurn(s);
}
function groupClear(s,i){const sp=SP[i];if(sp.t!=='prop')return true;return GROUP[sp.g].every(j=>!s.props[j]||!s.props[j].h)}
function tradeable(s,i,id){const o=s.props[i];return o&&o.o===id&&groupClear(s,i)}
const playing=s=>s.status==='playing';

const A={
 join(s){if(s.status!=='lobby')return 'This game has already started.';if(P(s,me))return;if(s.players.length>=6)return 'This table is full (6 players).';
   const tok=TOKENS.find(t=>!s.players.some(p=>p.tok===t));const np=newPlayer(me,tok);np.nick=(load('mgo-nick')||'').slice(0,16);s.players.push(np);L(s,pt(me)+' sat down.')},
 tok(s,t){if(s.status!=='lobby'||!TOKS[t])return;const p=P(s,me);if(!p)return;if(s.players.some(q=>q.tok===t&&q.id!==me))return 'Someone already has that piece.';p.tok=t},
 nick(s,n){const p=P(s,me);if(!p)return;p.nick=String(n||'').trim().slice(0,16)},
 leave(s){if(s.status!=='lobby')return;s.players=s.players.filter(p=>p.id!==me);
   if(!s.players.length){s.status='closed';return}if(s.host===me)s.host=s.players[0].id},
 start(s){if(s.host!==me)return 'Only the host can start.';if(s.status!=='lobby')return;if(s.players.length<2)return 'You need at least 2 players.';
   for(let i=s.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s.players[i],s.players[j]]=[s.players[j],s.players[i]]}
   s.status='playing';s.turn=0;s.phase='roll';L(s,'Game on! '+pt(s.players[0].id)+' goes first.')},
 roll(s){const p=cur(s);if(!playing(s))return;if(p.id!==me)return "It's not your turn.";if(s.phase!=='roll')return "You've already rolled.";if(p.cash<0)return 'Clear your debt before rolling.';
   const d=[r6(),r6()],dbl=d[0]===d[1],tot=d[0]+d[1];s.dice=d;s.rollId=(s.rollId||0)+1;s.card=null;
   L(s,pt(p.id)+' rolled '+d[0]+' + '+d[1]+(dbl?' (doubles)':'')+'.');
   if(p.inJail){
     if(dbl){p.inJail=false;p.jailTurns=0;L(s,pt(p.id)+' rolled doubles and slipped out of the cave.');s.lastDoubles=false;moveBy(s,p,tot);land(s,p);afterMove(s,p);return}
     p.jailTurns++;
     if(p.jailTurns>=3){payTo(s,p,50,null);p.inJail=false;p.jailTurns=0;L(s,pt(p.id)+' paid a 🪙50 ransom to Polyphemus after three tries.');s.lastDoubles=false;moveBy(s,p,tot);land(s,p);afterMove(s,p);return}
     L(s,pt(p.id)+" stays in the Cyclops' Cave.");s.phase='end';return;
   }
   s.dbl=dbl?(s.dbl||0)+1:0;
   if(s.dbl>=3){L(s,'Three doubles in a row. Too fast!');toJail(s,p);s.phase='end';return}
   s.lastDoubles=dbl;moveBy(s,p,tot);land(s,p);afterMove(s,p)},
 bail(s){const p=cur(s);if(p.id!==me||!p.inJail||s.phase!=='roll')return;if(p.cash<50)return 'You need 🪙50 for the ransom.';p.cash-=50;p.inJail=false;p.jailTurns=0;L(s,pt(p.id)+' paid Polyphemus a 🪙50 ransom.')},
 card(s){const p=cur(s);if(p.id!==me||!p.inJail||s.phase!=='roll'||!p.free)return;p.free--;p.inJail=false;p.jailTurns=0;L(s,pt(p.id)+" used Athena's help to escape the cave.")},
 buy(s){const p=cur(s);if(p.id!==me||s.phase!=='buy')return;const i=s.pending,sp=SP[i];if(p.cash<sp.p)return 'Not enough cash to buy this.';
   p.cash-=sp.p;s.props[i]={o:p.id,h:0,m:false};L(s,pt(p.id)+' bought '+st(i)+' for 🪙'+sp.p+'.');s.pending=null;s.phase='';afterMove(s,p)},
 pass(s){const p=cur(s);if(p.id!==me||s.phase!=='buy')return;L(s,pt(p.id)+' passed on '+st(s.pending)+'.');s.pending=null;s.phase='';afterMove(s,p)},
 end(s){const p=cur(s);if(!playing(s)||p.id!==me)return;if(s.phase!=='end')return 'Finish your move first.';if(p.cash<0)return "You're in debt. Mortgage or sell to raise cash, or declare bankruptcy.";nextTurn(s)},
 skip(s){if(s.host!==me||!playing(s))return;const p=cur(s);L(s,'The host skipped '+pt(p.id)+"'s turn.");if(p.cash<0){bankrupt(s,p);return}nextTurn(s)},
 build(s,i){i=+i;const o=s.props[i],sp=SP[i],p=P(s,me);if(!playing(s)||!o||o.o!==me)return "You don't own that.";if(sp.t!=='prop')return 'You can only build on lands.';
   if(!ownsGroup(s,sp.g,me))return 'You need the whole colour set first.';if(GROUP[sp.g].some(j=>s.props[j].m))return 'Pay off the mortgages in this set first.';
   if(o.h>=5)return 'Already has a temple.';const min=Math.min(...GROUP[sp.g].map(j=>s.props[j].h));if(o.h>min)return 'Build evenly across the set.';
   const c=houseCost(i);if(p.cash<c)return 'Not enough cash.';p.cash-=c;o.h++;L(s,pt(me)+' built '+(o.h===5?'a temple':'a villa')+' on '+st(i)+'.')},
 sell(s,i){i=+i;const o=s.props[i],sp=SP[i],p=P(s,me);if(!o||o.o!==me||!o.h)return;const max=Math.max(...GROUP[sp.g].map(j=>s.props[j].h));if(o.h<max)return 'Sell evenly across the set.';
   p.cash+=houseCost(i)/2;o.h--;L(s,pt(me)+' sold a building on '+st(i)+'.')},
 mort(s,i){i=+i;const o=s.props[i],p=P(s,me);if(!o||o.o!==me||o.m)return;if(!groupClear(s,i))return 'Sell the buildings in this set first.';o.m=true;p.cash+=SP[i].p/2;L(s,pt(me)+' mortgaged '+st(i)+' for 🪙'+SP[i].p/2+'.')},
 unmort(s,i){i=+i;const o=s.props[i],p=P(s,me);if(!o||o.o!==me||!o.m)return;const c=unmortCost(i);if(p.cash<c)return 'You need 🪙'+c+' to lift the mortgage.';p.cash-=c;o.m=false;L(s,pt(me)+' paid off the mortgage on '+st(i)+'.')},
 resign(s){const p=P(s,me);if(!playing(s)||!p||p.bankrupt)return;if(p.cash>=0)p.creditor=null;bankrupt(s,p)},
 propose(s,t){if(!playing(s))return;if(s.trade)return "There's already a trade on the table.";const p=P(s,me),q=P(s,t.to);if(!p||!q||q.bankrupt||q.id===me)return 'Pick someone to trade with.';
   if(!t.give.length&&!t.get.length&&!t.giveCash&&!t.getCash)return 'Add something to the trade.';
   if(t.give.some(i=>!tradeable(s,i,me))||t.get.some(i=>!tradeable(s,i,q.id)))return "Some of those lands can't be traded (sell the buildings in that set first).";
   if(t.giveCash>p.cash)return "You don't have that much cash.";
   s.trade={from:me,to:q.id,give:t.give,get:t.get,giveCash:t.giveCash,getCash:t.getCash};L(s,pt(me)+' offered '+pt(q.id)+' a trade.')},
 accept(s){const t=s.trade;if(!t||t.to!==me)return;const a=P(s,t.from),b=P(s,t.to);
   if(t.give.some(i=>!tradeable(s,i,a.id))||t.get.some(i=>!tradeable(s,i,b.id)))return 'That trade is no longer possible. Ask them to withdraw it.';
   if(a.cash<t.giveCash||b.cash<t.getCash)return 'Someone no longer has enough cash for this trade.';
   t.give.forEach(i=>s.props[i].o=b.id);t.get.forEach(i=>s.props[i].o=a.id);a.cash+=t.getCash-t.giveCash;b.cash+=t.giveCash-t.getCash;
   L(s,pt(b.id)+' accepted '+pt(a.id)+"'s trade.");s.trade=null},
 decline(s){const t=s.trade;if(!t||(t.to!==me&&t.from!==me))return;L(s,pt(me)+(t.from===me?' withdrew their trade offer.':' turned down the trade.'));s.trade=null}
};
function newPlayer(id,tok){return {id:id,tok:tok,nick:'',cash:1500,pos:0,inJail:false,jailTurns:0,free:0,bankrupt:false,creditor:null}}


// ================= 3D scene =================
// Board geometry: 11x11 grid of tiles around a central city. Units are world units; the board spans -HALF..HALF.
const HALF=5.95, CORNER=1.45, GAP=0.05;
const tAlong=k=>k===0?HALF-CORNER/2:k===10?-(HALF-CORNER/2):5-k;
function cellCenter(i){
  i=((i%40)+40)%40;
  if(i<=10)return {x:tAlong(i),z:HALF-CORNER/2,side:'b'};
  if(i<=20)return {x:-(HALF-CORNER/2),z:tAlong(i-10),side:'l'};
  if(i<=30)return {x:-tAlong(i-20),z:-(HALF-CORNER/2),side:'t'};
  return {x:HALF-CORNER/2,z:-tAlong(i-30),side:'r'};
}
function frame(i){
  i=((i%40)+40)%40;const c=cellCenter(i);let inw;
  if(i%10===0)inw={x:-Math.sign(c.x)/Math.SQRT2,z:-Math.sign(c.z)/Math.SQRT2};
  else inw=c.side==='b'?{x:0,z:-1}:c.side==='l'?{x:1,z:0}:c.side==='t'?{x:0,z:1}:{x:-1,z:0};
  return {c:c,inw:inw,lat:{x:-inw.z,z:inw.x}};
}

// ---- board: a rounded base with 40 raised toy tiles ----
function tileDraw(i){
  return (x,W,H)=>{
    const sp=SP[i],corner=i%10===0,u=W/100; // 100 units across the tile width
    x.clearRect(0,0,W,H);
    const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fffdf6');bg.addColorStop(1,'#f6ecd6');x.fillStyle=bg;x.fillRect(0,0,W,H);
    x.textAlign='center';x.textBaseline='middle';
    const fit=(txt,max,size,weight)=>{let s=size;x.font=weight+' '+s*u+'px "Nunito", "Arial Rounded MT Bold", Arial, sans-serif';while(x.measureText(txt).width>max*u&&s>6){s-=1;x.font=weight+' '+s*u+'px "Nunito", "Arial Rounded MT Bold", Arial, sans-serif'}return s};
    const words=(n)=>{const w=n.toUpperCase().split(' ');if(w.length===1)return [w[0]];let best=null;for(let k=1;k<w.length;k++){const a=w.slice(0,k).join(' '),b=w.slice(k).join(' ');const sc=Math.max(a.length,b.length);if(!best||sc<best.sc)best={sc:sc,l:[a,b]}}return best.l};
    if(corner){
      const cc={0:['#ffd23f','#ff9f1c'],10:['#9c6b4a','#6b4630'],20:['#ff8fc8','#e0559f'],30:['#ff6b5a','#d93a2b']}[i];
      const g=x.createRadialGradient(W/2,H*0.42,10,W/2,H*0.42,W*0.6);g.addColorStop(0,cc[0]);g.addColorStop(1,cc[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
      x.font=46*u+'px sans-serif';x.fillText(sp.ic,W/2,H*0.4);
      x.fillStyle='#fff';x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=3*u;x.lineJoin='round';
      const l=words(sp.n);l.forEach((t,k)=>{const s=fit(t,90,15,'900');x.strokeText(t,W/2,H*(0.72+k*0.13));x.fillText(t,W/2,H*(0.72+k*0.13))});
      return;
    }
    const band=sp.t==='prop'?GC[sp.g]:{rail:'#2f86d8',util:'#7b5cd6',tax:'#e2453a',fortune:'#f4b223',whip:'#1fb2aa'}[sp.t];
    // colour band at the inner edge (top of the texture = toward the board centre)
    const bh=H*0.27;const g=x.createLinearGradient(0,0,0,bh);g.addColorStop(0,band);g.addColorStop(1,shade(band,-0.15));x.fillStyle=g;x.fillRect(0,0,W,bh);
    x.fillStyle='rgba(255,255,255,.25)';x.fillRect(0,0,W,bh*0.18);
    const icon=sp.t==='prop'?GLYPH[sp.g]:sp.ic;
    x.font=(sp.t==='prop'?20:22)*u+'px sans-serif';x.fillText(icon,W/2,bh*0.55);
    x.fillStyle='#22263a';
    const l=words(sp.n);const base=sp.t==='prop'?H*0.44:H*0.42;
    l.forEach((t,k)=>{const s=fit(t,90,l.length>1?15:17,'900');x.fillText(t,W/2,base+k*s*u*1.1)});

// ---- dice: tumble in front of the camera, then settle and fade ----
function faceQuat(v,yaw){
  const T=S3.T,e={1:[0,0,0],6:[Math.PI,0,0],2:[-Math.PI/2,0,0],5:[Math.PI/2,0,0],3:[0,0,Math.PI/2],4:[0,0,-Math.PI/2]}[v]||[0,0,0];
  const qf=new T.Quaternion().setFromEuler(new T.Euler(e[0],e[1],e[2]));const qy=new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0),yaw);

  const qt=new T.Quaternion().setFromAxisAngle(new T.Vector3(1,0,0),0.95);return qt.multiply(qy.multiply(qf));
}
function rollDice(d,done){
  const T=S3.T;S3.diceT++;const id=S3.diceT;
  S3.dice.forEach((m,k)=>{
    const tq=faceQuat(d[k],rnd(-0.35,0.35)),axis=new T.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize(),spins=Math.PI*2*rnd(2.5,3.6);
    const end=new T.Vector3(k?0.36:-0.36,-0.05,-3.1),start=new T.Vector3(k?1.4:-1.4,-1.5,-2.6);
    m.visible=true;m.scale.setScalar(1);
    if(reduceMotion()){m.quaternion.copy(tq);m.position.copy(end);return}
    anim(950+k*120,t=>{const e=1-Math.pow(1-t,3);m.position.lerpVectors(start,end,e);m.position.y+=Math.sin(t*Math.PI)*0.55;m.quaternion.copy(tq).multiply(new T.Quaternion().setFromAxisAngle(axis,(1-e)*spins))},k?()=>{done&&done()}:null);

}

async function mutate(fn){
  if(busy)return;busy=true;renderPanels();
  try{
    if(db.transact){const err=await db.transact('games/'+code,s=>{const e=fn(s);if(e)return e;s.rev=(s.rev||0)+1;s.updatedAt=Date.now()});if(err)toast(err);return}
    const ref=db.doc('games/'+code);
    for(let k=0;k<14;k++){
      const lease=await ref.acquire({holder:(me||'x')+':'+tabId,ttlMs:1500});
      if(!lease.acquired){await sleep(150+Math.random()*250);continue}
      const snap=await ref.get();if(!snap.exists)return;
      const s=JSON.parse(JSON.stringify(snap.data()));

// ---- events from the shared state ----
function banner(html){const b=$('banners');if(!b)return;const el=document.createElement('div');el.className='banner';el.innerHTML=html;b.prepend(el);while(b.children.length>3)b.lastChild.remove();setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},3400)}
function feedback(s){
  const p=prevSnap;
  prevSnap={rollId:s.rollId,turn:s.turn,status:s.status,cash:Object.fromEntries(s.players.map(q=>[q.id,q.cash])),h:Object.values(s.props).reduce((a,o)=>a+(o.h||0),0),log:s.log.length,logLast:s.log[s.log.length-1]};
  if(!p)return;
  const rolled=s.rollId!==p.rollId,moveDelay=rolled?2100:0;
  if(rolled)SFX.dice();
  // new log lines as banners (skip the plain roll line; the dice show that)
  let fresh=[];if(s.log[s.log.length-1]!==p.logLast){for(let k=s.log.length-1;k>=0&&fresh.length<3;k--){if(s.log[k]===p.logLast)break;fresh.unshift(s.log[k])}}
  fresh=fresh.filter(l=>!/ rolled \d/.test(l)&&!/ drew (The Fates|The Oracle):/.test(l));
  setTimeout(()=>fresh.slice(-2).forEach(l=>banner(fmt(l))),moveDelay);
  const mine=P(s,me);
  if(mine&&p.cash[me]!=null&&mine.cash!==p.cash[me]){const d=mine.cash-p.cash[me];setTimeout(()=>{d>0?SFX.coin():SFX.pay();popMoney(d)},moveDelay)}
  if(prevSnap.h>p.h)setTimeout(()=>SFX.build(),300);
  if(s.status==='playing'&&cur(s).id===me&&(p.turn!==s.turn||p.status!=='playing')){setTimeout(()=>{SFX.turn();banner('⭐ <b>Your turn!</b> Tap ROLL.');try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}},400);flashTitle()}
}
function autoModals(s){
  if(!s||s.status==='lobby')return;
  const rolledDelay=2300;
  const ck=s.card?(s.rollId+':'+s.card.t+':'+s.card.by):'';
  if(s.card&&ck!==seenCard){const first=seenCard==='';seenCard=ck;if(!first)setTimeout(()=>{if(state&&state.card&&(state.rollId+':'+state.card.t+':'+state.card.by)===ck)openModal('card',state.card)},rolledDelay)}
  if(!s.card)seenCard=seenCard||'none';
  const bk=s.phase==='buy'&&cur(s).id===me?s.rollId+':'+s.pending:'';
  if(bk&&bk!==seenBuy){seenBuy=bk;setTimeout(()=>{if(state&&state.phase==='buy'&&cur(state).id===me&&!(modal&&modal.kind==='card'))openModal('buy',state.pending);else if(state&&state.phase==='buy')setTimeout(()=>{if(state&&state.phase==='buy'&&cur(state).id===me&&!modal)openModal('buy',state.pending)},2600)},rolledDelay)}
  if(modal&&modal.kind==='buy'&&(s.phase!=='buy'||cur(s).id!==me))closeModal();
  if(s.status==='over'&&!seenOver){seenOver=true;setTimeout(()=>openModal('winner'),800)}
}
function popMoney(d){const c=document.querySelector('.pchip .cs')&&[...document.querySelectorAll('.pchip')].find(x=>x.dataset.pid===me);if(!c)return;const r=c.getBoundingClientRect();
  const el=document.createElement('div');el.className='pop '+(d>0?'up':'down');el.textContent=(d>0?'+':'−')+'🪙'+Math.abs(d);el.style.left=(r.left+20)+'px';el.style.top=(r.bottom+6)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
  if(d>0&&!reduceMotion())for(let k=0;k<8;k++){const cn=document.createElement('div');cn.className='coin';cn.textContent='🪙';cn.style.left=(innerWidth/2-11)+'px';cn.style.top=(innerHeight*0.45)+'px';cn.style.setProperty('--dx',(r.left+20-innerWidth/2+rnd(-10,10))+'px');cn.style.setProperty('--dy',(r.top-innerHeight*0.45)+'px');cn.style.animationDelay=(k*0.05)+'s';document.body.appendChild(cn);setTimeout(()=>cn.remove(),1500)}}
let titleT=null;function flashTitle(){if(!document.hidden)return;let k=0;clearInterval(titleT);titleT=setInterval(()=>{document.title=(k++%2)?'Your turn! · M.Go':'M.Go';if(!document.hidden){clearInterval(titleT);document.title='M.Go'}},1000)}

// ---- sound ----
let AC=null,muted=load('mgo-mute')==='1';
function ac(){if(muted)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||0.15,a.currentTime+t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05)}
function noise(t0,dur,vol){const a=ac();if(!a)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur|0),a.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;s.buffer=b;g.gain.value=vol||0.35;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
const SFX={
  dice(){for(let k=0;k<6;k++)noise(0.08+k*0.11+Math.random()*0.04,0.06,0.3-k*0.04)},
  step(){tone(520+Math.random()*80,0,0.07,'triangle',0.06)},
  coin(){tone(1320,0,0.12,'triangle',0.12);tone(1760,0.07,0.18,'triangle',0.1)},
  pay(){tone(520,0,0.14,'triangle',0.12);tone(390,0.09,0.2,'triangle',0.1)},
  turn(){tone(659,0,0.25,'sine',0.14);tone(880,0.12,0.25,'sine',0.12);tone(1175,0.24,0.35,'sine',0.1)},
  build(){tone(330,0,0.1,'square',0.05);tone(494,0.08,0.1,'square',0.05);tone(659,0.16,0.18,'square',0.05)},
  tap(){tone(880,0,0.05,'sine',0.05)}
};
window.SFX=SFX;

// ---- input ----
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,arg=b.dataset.arg;SFX.tap();
  if(a==='menu'){openSheet('menu');return}
  if(a==='close'){closeSheet();return}
  if(a==='closemodal'){closeModal();return}
  if(a==='sheet'){if(arg==='trade')tradeOpen=false;openSheet(arg);return}
  if(a==='players'){openSheet('players');return}
  if(a==='land'){sel=+arg;sheet='land';renderSheet(true);syncScene();return}
  if(a==='cam'){S3.userMoved=false;setView(S3.mode==='follow'?'board':'follow');renderRail();if(sheet==='menu')renderSheet();return}
  if(a==='view'){closeSheet();setView(arg);renderRail();return}
  if(a==='mute'){muted=!muted;store('mgo-mute',muted?'1':'0');renderRail();if(sheet==='menu')renderSheet();if(!muted)SFX.coin();return}
  if(a==='buyprompt'){openModal('buy',state.pending);return}
  if(a==='winner'){openModal('winner');return}
  if(a==='home'){closeModal();closeSheet(true);closeGame();return}
  if(a==='open'){openGame(arg);return}
  if(a==='new'){createGame();return}
  if(a==='invite'){const url=location.origin+location.pathname+'#'+code,txt='Join my M.Go table '+code;if(navigator.share){navigator.share({title:'M.Go',text:txt,url:url}).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Invite link copied. Paste it to your friends.')).catch(()=>toast('Send this link: '+url))}return}
  if(a==='tradeopen'){tradeOpen=true;draft={to:'',give:[],get:[],giveCash:0,getCash:0};renderSheet();return}
  if(a==='tradeclose'){tradeOpen=false;renderSheet();return}
  if(a==='askresign'){confirmResign=true;renderSheet();return}
  if(a==='noresign'){confirmResign=false;renderSheet();return}
  if(a==='resign'){confirmResign=false;closeSheet(true)}
  if(a==='leave'){mutate(s=>A.leave(s)).then(closeGame);return}
  if(a==='buy'||a==='pass'){closeModal()}
  if(a==='roll'){S3.userMoved=false;if(S3.narrow&&S3.mode!=='follow'){setView('follow')}}
  if(a==='propose'){const t={to:draft.to,give:draft.give.slice(),get:draft.get.slice(),giveCash:Math.max(0,Math.floor(+draft.giveCash||0)),getCash:Math.max(0,Math.floor(+draft.getCash||0))};
    mutate(s=>A.propose(s,t)).then(()=>{if(state&&state.trade&&state.trade.from===me){tradeOpen=false;renderSheet()}});return}
  if(A[a])mutate(s=>A[a](s,arg));
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='nick')nickDraft=t.value;else if(t.id==='tr-gc')draft.giveCash=t.value;else if(t.id==='tr-tc')draft.getCash=t.value});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='nick'){const v=t.value;store('mgo-nick',v.trim().slice(0,16));mutate(s=>A.nick(s,v)).then(()=>{nickDraft=null})}
  else if(t.id==='tr-to'){draft.to=t.value;draft.get=[];renderSheet()}
  else if(t.dataset&&t.dataset.tr){const k=t.dataset.tr,i=+t.value;draft[k]=t.checked?draft[k].concat(i):draft[k].filter(x=>x!==i)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else if(sheet)closeSheet()}});
document.addEventListener('click',e=>{if(e.target.id==='sheetscrim')closeSheet()});

render();
boot().catch(()=>{bootDone=true;render()});

document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&modal&&modal.kind!=='winner')closeModal()});
</script>
